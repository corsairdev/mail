services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mail
    ports:
      - "54329:5432"
    volumes:
      - mail-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mail"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  mail-pg:
